<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f5fbf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="R&amp;R Assembly">
<title>R&amp;R Assembly Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Calm, professional field tool. Atkinson Hyperlegible (built for low-vision readers) throughout; deep navy ink, one trustworthy blue accent, semantic green/amber/red only for status. Everything in rem so the Text size setting scales the whole app. One column, thumb-sized controls, total pinned above the tab bar. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#0f2233; --muted:#4b5968; --line:#d6dde5;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e6eefa;
  --good:#16703e; --warn:#8a5300; --bad:#b3261e;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:var(--font); --body:var(--font);
  --r:14px; --tap:3.25rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c131a; --surface:#15202b; --ink:#eef2f6; --muted:#a9b6c3; --line:#2b3947;
  --accent:#86b4ff; --accent-ink:#061424; --accent-soft:#1b2d45;
  --good:#63d394; --warn:#f3b75a; --bad:#ff8f86; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c131a; --surface:#15202b; --ink:#eef2f6; --muted:#a9b6c3; --line:#2b3947;
  --accent:#86b4ff; --accent-ink:#061424; --accent-soft:#1b2d45;
  --good:#63d394; --warn:#f3b75a; --bad:#ff8f86; color-scheme:dark;}
html{font-size:100%}
html.ts-l{font-size:112.5%} html.ts-xl{font-size:125%}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.125rem;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:40rem;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.85rem 1rem .6rem;background:var(--surface);border-bottom:1px solid var(--line)}
header.top h1{font-weight:700;font-size:1.35rem;margin:0;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.sync{font-size:.8rem;color:var(--muted);text-align:right;line-height:1.2}
main>*{flex-shrink:0}
main{flex:1;overflow-y:auto;padding:1rem 1rem 1.5rem;display:flex;flex-direction:column;gap:1rem;-webkit-overflow-scrolling:touch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.stack{display:flex;flex-direction:column;gap:.75rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media (max-width:22.5rem){.row2{grid-template-columns:1fr}}
h2.title,.sec h2{font-size:1.05rem;font-weight:700;margin:0 .15rem .5rem;display:flex;justify-content:space-between;gap:.5rem;color:var(--ink)}
.sec h2 span+span{color:var(--muted);font-weight:400}
.sub-h{font-size:1.15rem;font-weight:700;margin:0}
label.f{display:flex;flex-direction:column;gap:.35rem;font-size:1rem;color:var(--ink);font-weight:700}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=password],input.num,select,textarea{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:.7rem .8rem;font-size:1.1rem;width:100%;min-width:0;min-height:var(--tap);font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
textarea{min-height:5.5rem;resize:vertical}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.5rem}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:.6rem .7rem;font-weight:700;font-size:1.05rem;display:flex;gap:.4rem;align-items:center;justify-content:center;min-height:var(--tap);text-align:center;line-height:1.15}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:.8rem;min-width:1.4rem;height:1.4rem;padding:0 .4rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.chip[aria-pressed="true"] .badge{background:var(--accent-ink);color:var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:.75rem;padding:.75rem .75rem .75rem 1rem;border-top:1px solid var(--line);min-height:4.25rem}
.item:first-child{border-top:0}
.item.on{background:var(--accent-soft);box-shadow:inset 5px 0 0 var(--accent)}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.item .nm small{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.item .nm small.none{color:var(--warn)}
.step{display:flex;align-items:center;gap:.35rem;flex:none}
.step button{width:var(--tap);height:var(--tap);border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.7rem;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.step button.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step input{width:3rem;height:var(--tap);min-height:0;text-align:center;padding:0;font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums;background:transparent;border:0}
@media (max-width:22.5rem){.step button{width:2.9rem;height:2.9rem}.step input{width:2.4rem}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:12px;padding:.7rem 1rem;font-weight:700;font-size:1.05rem;border:2px solid var(--line);background:var(--surface);min-height:var(--tap);text-decoration:none;text-align:center;line-height:1.2;color:inherit}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn.danger.fill{background:var(--bad);color:#fff}
.btn.wide{width:100%}
.btn.sm{min-height:2.75rem;padding:.45rem .8rem;font-size:1rem}
.btn[disabled]{opacity:.5}
.btn.add{border-style:dashed;color:var(--accent);border-color:var(--accent);background:transparent;width:100%}
.btns{display:flex;gap:.6rem;flex-wrap:wrap}
.btns .btn{flex:1 1 9rem}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:.5rem 0;text-align:left;font-size:1.05rem;min-height:2.75rem}
.back{background:none;border:0;color:var(--accent);font-weight:700;font-size:1.1rem;padding:.35rem 0;display:inline-flex;align-items:center;gap:.35rem;min-height:2.75rem;align-self:flex-start}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.95rem;margin:0}
.note{font-size:1rem;border-radius:12px;padding:.8rem 1rem;background:var(--accent-soft);border:1px solid var(--accent);line-height:1.4}
.note .link{padding:0;min-height:0;display:inline}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.more>summary{list-style:none;cursor:pointer;padding:1rem;font-weight:700;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;min-height:var(--tap)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-size:1.6rem;line-height:1;color:var(--accent)}
details.more[open]>summary::after{content:"−"}
details.more>.inner{padding:0 1rem 1rem;display:flex;flex-direction:column;gap:1rem}
.bar{background:var(--surface);border-top:1px solid var(--line);padding:.7rem 1rem;display:flex;align-items:center;gap:.75rem}
.bar .tot{flex:1;min-width:0}
.bar .tot .lbl{font-size:.9rem;color:var(--muted);font-weight:700}
.bar .tot .big{font-weight:700;font-size:2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.bar .keep{font-size:.95rem;font-weight:700;color:var(--good)}
.bar .btn{min-width:7.5rem}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;padding:.5rem .15rem .55rem;font-weight:700;color:var(--muted);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-height:3.9rem;position:relative;line-height:1.1}
nav.tabs svg{width:1.6rem;height:1.6rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
nav.tabs .badge{position:absolute;top:.3rem;left:calc(50% + .5rem)}
.sheet{position:fixed;inset:0;background:rgba(5,15,25,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .panel{background:var(--surface);width:100%;max-width:40rem;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet .phead{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1rem;border-bottom:1px solid var(--line)}
.sheet .phead h3{margin:0;font-size:1.3rem}
.sheet .pbody{overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
.x{background:none;border:2px solid var(--line);border-radius:12px;font-size:1.6rem;line-height:1;width:var(--tap);height:var(--tap);color:var(--ink)}
.confirm p{font-size:1.15rem;margin:0}
table.lines{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1.05rem}
table.lines td{padding:.5rem 0;border-bottom:1px solid var(--line);vertical-align:top}
table.lines td.r{text-align:right;white-space:nowrap;padding-left:.5rem}
table.lines tr.grp td{font-weight:700;color:var(--muted);border-bottom:0;padding-top:1rem;font-size:.95rem}
table.lines tr.sum td{border-bottom:0;padding:.3rem 0}
table.lines tr.grand td{font-weight:700;font-size:1.7rem;border-top:3px solid var(--ink);padding-top:.6rem}
.warn{color:var(--warn)}
.est{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.9rem 1rem;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;min-height:4.25rem}
.est:first-child{border-top:0}
.est b{font-weight:700;overflow-wrap:anywhere}
.est small{line-height:1.35;font-size:.95rem}
.est .amt{font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.est .chev{font-size:1.6rem;color:var(--muted);flex:none}
.prow{display:grid;grid-template-columns:1fr 6.5rem var(--tap);gap:.5rem;align-items:center;padding:.75rem;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .del,.iconbtn{width:var(--tap);height:var(--tap);border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-size:1.25rem;padding:0;flex:none}
.prow .sub{grid-column:1/-1;display:flex;gap:.5rem;align-items:center;font-size:.95rem;color:var(--muted)}
.prow .sub select,.prow .sub input{min-height:2.75rem;padding:.4rem .6rem;font-size:1rem;width:auto;flex:1}
.money{position:relative}
.money::before{content:"$";position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-weight:700}
.money input{padding-left:1.7rem;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:11rem;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:.8rem 1.1rem;border-radius:12px;font-weight:700;z-index:20;max-width:90%;text-align:center;font-size:1rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.prev{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.prev table{border-collapse:collapse;font-size:.95rem;min-width:100%;font-variant-numeric:tabular-nums}
.prev th,.prev td{padding:.45rem .6rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.prev th{color:var(--muted);font-weight:700;background:var(--bg)}
.map{display:grid;grid-template-columns:auto 1fr;gap:.6rem .75rem;align-items:center;font-size:1rem}
.chk{display:flex;gap:.75rem;align-items:flex-start;font-size:1.05rem}
.chk input{width:1.6rem;height:1.6rem;flex:none;margin-top:.1rem;accent-color:var(--accent)}
.chk select{min-height:2.75rem;padding:.3rem .5rem;width:auto}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.empty{padding:1.5rem 1rem;text-align:center;color:var(--muted)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:.15rem .7rem;font-size:.9rem;font-weight:700;white-space:nowrap;flex:none;border:2px solid currentColor;line-height:1.3}
.pill.ok{color:var(--good)}.pill.done{color:var(--muted)}.pill.watch{color:var(--warn)}.pill.down{color:var(--bad)}
.part{display:grid;gap:.7rem;padding:1rem;border-top:1px solid var(--line)}
.part:first-child{border-top:0}
.part .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem}
.part .ph b{display:block;line-height:1.25}
.part .meta{display:flex;flex-direction:column;gap:.1rem;font-size:.95rem;color:var(--muted)}
.part .track{display:flex;flex-wrap:wrap;gap:.4rem}
.part .track span{font-size:.85rem;font-weight:700;border-radius:8px;padding:.2rem .55rem;background:var(--bg);color:var(--muted);white-space:nowrap}
.part .acts{display:grid;grid-template-columns:auto 1fr var(--tap);gap:.5rem;align-items:stretch}
.part .acts .btn{white-space:nowrap}
.part .acts select{min-height:var(--tap);padding:.4rem .7rem}
.part .acts .del{width:var(--tap);min-height:var(--tap);padding:0;border-radius:12px;border:2px solid var(--line);background:none;color:var(--muted);font-size:1.25rem}
.part .prices{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.part .prices label{display:flex;flex-direction:column;gap:.25rem;font-size:.9rem;color:var(--muted);font-weight:700}
@media (max-width:22.5rem){.part .acts{grid-template-columns:1fr var(--tap)}.part .acts .btn{grid-column:1/-1}}
.addpart{display:grid;gap:.75rem;padding:1rem;border-top:1px solid var(--line)}
.addpart:first-child{border-top:0}
.ptot{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;padding:1rem;border-top:1px solid var(--line);background:var(--bg)}
.ptot:first-child{border-top:0}
.ptot span{display:flex;flex-direction:column;gap:.1rem}
.ptot small{font-size:.85rem;color:var(--muted);font-weight:700}
.ptot b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.rem{display:grid;gap:.6rem;padding:1rem;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.rem .rh{display:flex;gap:.75rem;align-items:flex-start;background:none;border:0;padding:0;text-align:left;width:100%}
.rem .rh .dot{width:.8rem;height:.8rem;border-radius:50%;margin-top:.4rem;flex:none;background:var(--warn)}
.rem .rh .dot.down{background:var(--bad)}
.rem .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.rem .acts .btn{min-height:2.9rem;padding:.4rem .4rem;font-size:.95rem;white-space:nowrap}
@media (max-width:22.5rem){.rem .acts{grid-template-columns:1fr 1fr}.rem .acts .btn:first-child{grid-column:1/-1}}
.lock{min-width:var(--tap);height:var(--tap);border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:1.15rem;line-height:1;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:0 .5rem;color:var(--muted)}
.lock svg{width:1.3rem;height:1.3rem;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lock.on{padding:0 .9rem;background:var(--good);color:#fff;border-color:var(--good);font-size:.95rem;font-weight:700;white-space:nowrap}
.pinpad input{font-size:2rem;text-align:center;letter-spacing:.4em}
.jobsum{border:3px solid var(--good);border-radius:var(--r);padding:1rem;display:grid;gap:.6rem;background:var(--surface)}
.jobsum .jh{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-weight:700}
.jobsum .row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:1.1rem;font-variant-numeric:tabular-nums}
.jobsum .row b{font-size:1.35rem}
.jobsum .keep{border-top:2px solid var(--line);padding-top:.6rem}
.jobsum .keep b{font-size:2.1rem;color:var(--good)}
.jobsum .keep b.neg{color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.seg button{min-height:var(--tap);border:2px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.paper{background:#fff;color:#0f2233;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.18);padding:1.1rem;font-size:.85rem;line-height:1.4;color-scheme:light}
.paper .ph1{display:flex;flex-direction:column;gap:.7rem;border-bottom:1px solid #d6dde5;padding-bottom:.8rem}
.paper .bz{display:flex;gap:.6rem;align-items:flex-start;min-width:0}
.paper .lg{max-width:4.5rem;max-height:3rem;object-fit:contain}
.paper .bn{font-weight:700;font-size:1.05rem}
.paper .sm{color:#5a6773;font-size:.8rem}.paper .sm b{color:#0f2233}
.paper .et{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem 1rem}.paper .et .ttl{width:100%}
.paper .ttl{color:#1f5fbf;font-weight:700;font-size:1.25rem;letter-spacing:.03em}
.paper .pf{margin-top:.9rem}
.paper .lb{font-size:.7rem;font-weight:700;color:#5a6773;letter-spacing:.06em}
.paper .cn{font-weight:700;font-size:1rem}
.paper .dt{width:100%;border-collapse:collapse;margin-top:.9rem;font-variant-numeric:tabular-nums}
.paper .dt th{background:#eef2f7;color:#5a6773;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;padding:.4rem .35rem;text-align:left}
.paper .dt td{padding:.4rem .35rem;border-bottom:1px solid #e3e8ee;vertical-align:top}
.paper .dt tr.g td{color:#1f5fbf;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:0;padding-top:.7rem}
.paper .r{text-align:right;white-space:nowrap}
.paper .tt{margin:.8rem 0 0 auto;max-width:15rem;display:grid;gap:.25rem;font-variant-numeric:tabular-nums}
.paper .tt div{display:flex;justify-content:space-between;gap:1rem}
.paper .tt .gt{background:#1f5fbf;color:#fff;font-weight:700;font-size:1.05rem;padding:.45rem .6rem;border-radius:4px;margin-top:.2rem}
.paper .sg{display:grid;grid-template-columns:2fr 1fr;gap:1rem;margin-top:1.6rem;font-size:.7rem;color:#5a6773}
.paper .sg span{display:block;border-top:1px solid #0f2233;margin-bottom:.2rem;height:1.4rem}
.logo-prev{max-width:8rem;max-height:4rem;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.25rem}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem;padding:.9rem;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem;min-height:5.5rem;text-align:left}
.qbtn span{color:var(--accent);display:flex}
.qbtn:first-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.qbtn:first-child span{color:var(--accent-ink)}
.mi{width:2.4rem;height:2.4rem;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6rem,1fr));gap:.5rem}
.pthumb{padding:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--bg)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}

<body>
<div class="app">
  <header class="top"><div style="min-width:0"><h1 id="title">Estimates</h1><div class="sync" id="sync" style="text-align:left">Saved on this phone</div></div><button id="ownerbtn" class="lock" data-act="owner" aria-label="Show my costs"></button></header>
  <main id="main"></main>
  <div id="barwrap"></div>
  <nav class="tabs" id="tabs" aria-label="Main">
    <button data-act="view" data-v="home" id="hometab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>Home</button>
    <button data-act="view" data-v="jobs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 11h7M8.5 15h5"/></svg>Jobs</button>
    <button data-act="view" data-v="estimate"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8.5 6.5h7M8.5 11h1M12 11h1M8.5 14.5h1M12 14.5h1M8.5 18h1M12 18h1M15.5 11v7"/></svg>Estimate</button>
    <button data-act="view" data-v="pm" id="pmtab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5a6 6 0 0 1 12 0"/><path d="M15.5 5.2a3 3 0 0 1 0 5.6M18 19.5a6 6 0 0 0-3-5.2"/></svg>Customers</button>

  </nav>
</div>
<div id="overlay"></div>
<script>
(function(){
"use strict";
const SV=[{id:"move",n:"Move"},{id:"remove",n:"Haul away"},{id:"install",n:"Install"},{id:"service",n:"Maintenance"},{id:"repair",n:"Repair"}];
const SVN=Object.fromEntries(SV.map(s=>[s.id,s.n]));
const SV_=(p)=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON2={inbox:SV_('<path d="M3 13l2.5-7.5h13L21 13v6H3z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/>'),clip:SV_('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 11h7M8.5 15h5"/>'),calc:SV_('<rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8.5 6.5h7M8.5 11h1M12 11h1M8.5 14.5h1M12 14.5h1M8.5 18h1M12 18h1M15.5 11v7"/>'),user:SV_('<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>'),folder:SV_('<path d="M3.5 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>'),doc:SV_('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>'),book:SV_('<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/>'),share:SV_('<path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 12v8h14v-8"/>'),gear:SV_('<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>'),camera:SV_('<path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>')};
const ICON={...ICON2,trash:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg>`,
 lock:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>`,
 unlock:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 7.7-1.5"/></svg>`};
function applyTextSize(v){const r=document.documentElement;r.classList.remove("ts-l","ts-xl");if(v==="l")r.classList.add("ts-l");if(v==="xl")r.classList.add("ts-xl");}
try{applyTextSize(localStorage.getItem("gym-estimator.v1.text")||"m");}catch(e){}
const KEY="gym-estimator.v1";
const SAMPLE=[
["Cardio","Treadmill",150,175,125,95,125],["Cardio","Elliptical",125,150,125,85,115],["Cardio","Upright bike",60,75,75,65,95],
["Cardio","Recumbent bike",75,90,85,65,95],["Cardio","Spin bike",50,60,60,55,85],["Cardio","Rower",50,60,50,45,75],
["Cardio","Stair climber",200,225,175,110,150],["Cardio","Air / fan bike",50,60,60,45,75],
["Strength machines","Selectorized (pin-loaded) machine",150,175,150,75,110],["Strength machines","Plate-loaded machine",125,150,125,60,95],
["Strength machines","Cable crossover / functional trainer",250,275,300,95,125],["Strength machines","Smith machine",225,250,250,85,120],
["Strength machines","Multi-station gym",300,325,350,120,150],["Strength machines","Leg press / hack squat",200,225,200,75,110],
["Racks & benches","Power rack / squat rack",125,150,150,40,75],["Racks & benches","Half rack",90,110,110,35,70],
["Racks & benches","Adjustable bench",30,35,25,25,50],["Racks & benches","Flat bench",25,30,20,20,45],["Racks & benches","Olympic bench press",60,75,60,30,60],
["Free weights & storage","Dumbbell rack",60,75,60,25,50],["Free weights & storage","Dumbbells (per pair)",8,10,0,0,0],
["Free weights & storage","Weight plates (per 100 lb)",15,20,0,0,0],["Free weights & storage","Plate tree",25,30,20,0,0],
["Other","Rubber flooring (per 100 sq ft)",60,75,150,0,0],["Other","Wall mirror panel",75,90,125,0,60]
];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const emptyP=()=>({move:0,remove:0,install:0,service:0,repair:0});
function money(n){n=Math.round((+n||0)*100)/100;const whole=Math.abs(n%1)<0.005;return n.toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:whole?0:2,maximumFractionDigits:2});}
function numOf(v){if(typeof v==="number")return isFinite(v)?v:null;const s=String(v??"").replace(/[$,\s]/g,"");if(!s||!/^-?\d*\.?\d+$/.test(s))return null;return parseFloat(s);}

function defaults(){return{u:0,company:"",phone:"",taxRate:0,sample:true,
  cats:["Cardio","Strength machines","Racks & benches","Free weights & storage","Other"],
  items:SAMPLE.map(r=>({id:uid(),cat:r[0],name:r[1],p:{move:r[2],remove:r[3],install:r[4],service:r[5],repair:r[6]}})),
  extras:[{id:"trip",name:"Trip fee",price:75,unit:"per trip"},{id:"stairs",name:"Stairs",price:40,unit:"per flight, per piece"},{id:"labor",name:"Extra labor",price:85,unit:"per hour"},{id:"dump",name:"Disposal / dump fee",price:100,unit:"per load"}]};}
function newDraft(){return{id:uid(),u:Date.now(),created:Date.now(),customer:"",site:"",notes:"",counts:{},custom:[],extras:{},discount:0,tax:true};}

/* ---------- state ---------- */
let S={settings:defaults(),estimates:[],draft:newDraft(),deleted:[]};
let LS_HAD=false;
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.settings&&o.settings.items){S=Object.assign(S,o);LS_HAD=true;}}}catch(e){}
if(!S.pm||!Array.isArray(S.pm.sites))S.pm={sites:[],deleted:[]};
const ui={owner:false,pmSite:null,pmMachine:null,pmq:"",pmimp:null,copyText:null,view:"home",svc:"move",psvc:"move",q:"",sheet:null,imp:null,armed:null,showJob:false,addCustom:false};
const dirty={settings:false,draft:false,est:new Set(),del:new Set(S.deleted||[]),sites:new Set(),sdel:new Set(S.pm.deleted||[])};

let saveT=null;
/* second copy of everything, kept in the phone's database storage */
let mirrorP=null,mirrorT=null;
function mirrorDB(){if(!mirrorP)mirrorP=new Promise((res,rej)=>{try{const r=indexedDB.open("rr-data",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return mirrorP;}
function mirrorSave(){clearTimeout(mirrorT);mirrorT=setTimeout(async()=>{try{const db=await mirrorDB();db.transaction("kv","readwrite").objectStore("kv").put(JSON.stringify(S),"state");}catch(e){}},800);}
async function mirrorLoad(){try{const db=await mirrorDB();return await new Promise((res)=>{const r=db.transaction("kv").objectStore("kv").get("state");r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);});}catch(e){return null;}}
function hasData(){return S.estimates.length||(S.jobs||[]).length||(S.invoices||[]).length||S.pm.sites.length||(S.requests||[]).length||!S.settings.sample;}
function persist(){
  S.lastChange=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  mirrorSave();
  clearTimeout(saveT);saveT=setTimeout(flush,700);
}
function touchSettings(){S.settings.u=Date.now();dirty.settings=true;persist();}
function touchDraft(){S.draft.u=Date.now();dirty.draft=true;persist();}

/* ---------- cloud sync (per-person, private) ---------- */
let DB=null,BASE=null,chain=Promise.resolve();
function setSync(t){document.getElementById("sync").textContent=t;}
async function connect(tries){
  if(!window.claude||typeof window.claude.use!=="function"){if(tries<10)setTimeout(()=>connect(tries+1),500);return;}
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    DB=db;BASE="data/users/"+id;
    setSync("Syncing…");
    const timer=setTimeout(()=>setSync("Saved on this phone, cloud not reachable yet"),10000);
    await pull(); clearTimeout(timer);
    setSync("Synced to your account");
  }catch(e){setSync("Saved on this phone");}
}
function siteCol(){return DB.doc(BASE+"/profile").collection("sites");}
function estCol(){return DB.doc(BASE+"/profile").collection("estimates");}
async function pull(){
  const s=await DB.doc(BASE+"/settings").get();
  if(s.exists){const r=s.data();if(r.settings&&(r.u||0)>(S.settings.u||0)){S.settings=clone(r.settings);}else if((S.settings.u||0)>(r.u||0))dirty.settings=true;}
  else if(S.settings.u)dirty.settings=true;
  const d=await DB.doc(BASE+"/draft").get();
  if(d.exists){const r=d.data();if(r.draft&&(r.u||0)>(S.draft.u||0))S.draft=clone(r.draft);else dirty.draft=true;}else dirty.draft=true;
  const q=await estCol().get();
  const byId=new Map(S.estimates.map(e=>[e.id,e]));
  q.docs.forEach(doc=>{const r=doc.data();if(!r||!r.est)return;if(dirty.del.has(doc.id))return;const loc=byId.get(doc.id);
    if(!loc||(r.u||0)>(loc.u||0))byId.set(doc.id,clone(r.est));});
  const remoteIds=new Set(q.docs.map(x=>x.id));
  S.estimates.forEach(e=>{if(!remoteIds.has(e.id)||(byId.get(e.id)===e))dirty.est.add(e.id);});
  S.estimates=[...byId.values()].sort((a,b)=>(b.saved||0)-(a.saved||0));
  const sq=await siteCol().get();const sb=new Map(S.pm.sites.map(x=>[x.id,x]));
  sq.docs.forEach(doc=>{const r=doc.data();if(!r||!r.site||dirty.sdel.has(doc.id))return;const loc=sb.get(doc.id);if(!loc||(r.u||0)>(loc.u||0))sb.set(doc.id,clone(r.site));});
  const rs=new Set(sq.docs.map(x=>x.id));S.pm.sites.forEach(x=>{if(!rs.has(x.id)||sb.get(x.id)===x)dirty.sites.add(x.id);});
  S.pm.sites=[...sb.values()];
  await pullOps();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  render(); flush();
}
function flush(){
  if(!DB)return;
  chain=chain.then(async()=>{
    if(dirty.settings){dirty.settings=false;await DB.doc(BASE+"/settings").set({u:S.settings.u||Date.now(),settings:S.settings});}
    if(dirty.draft){dirty.draft=false;await DB.doc(BASE+"/draft").set({u:S.draft.u||Date.now(),draft:S.draft});}
    for(const id of [...dirty.est]){dirty.est.delete(id);const e=S.estimates.find(x=>x.id===id);if(e)await estCol().doc(id).set({u:e.u||Date.now(),est:e});}
    for(const id of [...dirty.del]){await estCol().doc(id).delete();dirty.del.delete(id);}
    for(const id of [...dirty.sites]){dirty.sites.delete(id);const x=S.pm.sites.find(y=>y.id===id);if(x)await siteCol().doc(id).set({u:x.u||Date.now(),site:x});}
    for(const id of [...dirty.sdel]){await siteCol().doc(id).delete();dirty.sdel.delete(id);}
    S.pm.deleted=[...dirty.sdel];
    await flushOps();
    S.deleted=[...dirty.del];try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    setSync("Synced to your account");
  }).catch(err=>{
    if(err&&err.code==="quota_exceeded")setSync("Cloud storage is full. Delete old estimates.");
    else setSync("Saved on this phone, will sync later");
  });
}

/* ---------- math ---------- */
function calc(d){
  const st=S.settings;const groups=[];let sub=0,pieces=0,unpriced=0;
  SV.forEach(s=>{const c=d.counts[s.id]||{};const lines=[];
    st.items.forEach(it=>{const q=+c[it.id]||0;if(q>0){const pr=+it.p[s.id]||0;if(!pr)unpriced++;lines.push({name:it.name,q,pr,t:q*pr});sub+=q*pr;pieces+=q;}});
    if(lines.length)groups.push({name:s.n,lines});});
  const cl=d.custom.filter(c=>c.qty>0).map(c=>({name:c.name,q:c.qty,pr:c.price,t:c.qty*c.price}));
  if(cl.length){groups.push({name:"Other items",lines:cl});cl.forEach(l=>{sub+=l.t;pieces+=l.q;});}
  const ex=[];let exT=0;st.extras.forEach(e=>{const q=+d.extras[e.id]||0;if(q>0){ex.push({name:e.name,q,pr:+e.price||0,t:q*(+e.price||0)});exT+=q*(+e.price||0);}});
  const pre=sub+exT;const disc=Math.round(pre*(+d.discount||0))/100;const after=pre-disc;
  const tax=(d.tax&&+st.taxRate)?Math.round(after*(+st.taxRate))/100:0;
  return{groups,sub,ex,exT,disc,tax,total:after+tax,pieces,unpriced};
}
function svcCount(id){const c=S.draft.counts[id]||{};let n=0;for(const k in c)n+=+c[k]||0;return n;}

/* ---------- category guessing ---------- */
function guessCat(name){const n=name.toLowerCase();
  if(/tread|ellip|bike|cycle|spin|rower|rowing|stair|stepper|climber|arc trainer|cross ?trainer|airdyne|assault|ski ?erg|jacobs/.test(n))return"Cardio";
  if(/rack|bench|cage|platform/.test(n))return"Racks & benches";
  if(/dumbbell|barbell|plate|kettlebell|\bbar\b|weights?\b|medicine ball|storage|tree/.test(n))return"Free weights & storage";
  if(/press|curl|extension|pulldown|pull down|row|fly|pec|lat|leg|chest|shoulder|abduct|adduct|glute|calf|tricep|bicep|crunch|machine|smith|cable|crossover|functional|hack|squat|multi|station/.test(n))return"Strength machines";
  return"Other";}

/* ---------- rendering ---------- */
const main=document.getElementById("main");
function renderOwner(){const b=document.getElementById("ownerbtn");if(!b)return;b.className="lock"+(ui.owner?" on":"");b.innerHTML=ui.owner?`${ICON.unlock}<span>Hide costs</span>`:ICON.lock;b.setAttribute("aria-label",ui.owner?"Hide my costs":"Show my costs");}
function softRender(){setTimeout(()=>{const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&main.contains(ae))return;render();},0);}
function render(){
  if(ui.mode){document.body.classList.add("formmode");document.getElementById("title").textContent=(ui.mode==="public"?(ui.pubCfg&&ui.pubCfg.b):S.settings.company)||"Service request";main.innerHTML=viewCustomerForm();renderBar();renderSheet();return;}
  document.body.classList.remove("formmode");
  renderOwner();renderNav();
  const keep=main.scrollTop;
  document.getElementById("title").textContent=S.settings.company||"Estimates";
  const tabFor={saved:"more",prices:"more",requests:"more",docs:"more",export:"more",import:"more",cform:"more"};const curTab=tabFor[ui.view]||ui.view;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===curTab?"page":"false"));
  const V={estimate:viewEstimate,saved:()=>backMore()+viewSaved(),pm:viewPM,prices:()=>backMore()+viewPrices(),home:viewHome,jobs:viewJobs,more:viewMore,requests:viewRequests,docs:viewDocs,export:viewExport,import:viewImport,cform:viewCformHub};
  main.innerHTML=(V[ui.view]||viewHome)();
  main.scrollTop=keep;
  renderBar();renderSheet();hydratePhotos();
}
function renderBar(){if(ui.mode){document.getElementById("barwrap").innerHTML="";return;}
  const w=document.getElementById("barwrap");
  if(ui.view!=="estimate"){w.innerHTML="";return;}
  const c=calc(S.draft);
  const js=jobSum(S.draft,c);
  w.innerHTML=`<div class="bar"><div class="tot"><div class="lbl">Total · ${c.pieces} piece${c.pieces===1?"":"s"}${c.unpriced?` · <span class="warn">${c.unpriced} without a price</span>`:""}</div><div class="big" id="bigtotal">${money(c.total)}</div>${ui.owner&&c.total?`<div class="keep">You keep ${money(js.keep)}</div>`:""}</div><button class="btn pri" data-act="review">Review</button></div>`;
}
function catsInOrder(){const st=S.settings;const set=new Set(st.cats);st.items.forEach(i=>set.add(i.cat||"Other"));return[...set];}
function sampleNote(){return S.settings.sample?`<div class="note"><b>These are sample prices.</b> Put in your own on the <button class="link" data-act="view" data-v="prices">Settings</button> tab.</div>`:"";}

function viewEstimate(){
  const d=S.draft,st=S.settings,svc=ui.svc,c=d.counts[svc]||{};
  const q=norm(ui.q);
  let h=sampleNote();
  h+=`<div class="card stack"><h2 class="sub-h">Customer</h2><div class="stack"><label class="f">Name<input type="text" id="f-customer" data-field="customer" value="${esc(d.customer)}" placeholder="Business or person" autocomplete="off"></label>
  <label class="f">Location<input type="text" id="f-site" data-field="site" value="${esc(d.site)}" placeholder="Address or gym" autocomplete="off"></label></div></div>`;

const CONFIRM={del:["Delete this estimate?","Delete"],item:["Remove this equipment from your price list?","Remove"],reset:["Reset all prices to the samples? Your own prices will be replaced.","Reset prices"],new:["Start a new estimate? The one on screen isn't saved yet.","Start new"],log:["Delete this history entry?","Delete"],mach:["Delete this machine and its history?","Delete machine"],site:["Delete this customer and all their machines?","Delete customer"],part:["Remove this part?","Remove"],job:["Delete this job? Its photos will be deleted too.","Delete job"],inv:["Delete this invoice?","Delete invoice"],tip:["Delete this service tip?","Delete tip"],photo:["Delete this photo?","Delete photo"],pay:["Remove this payment?","Remove"]};
function askConfirm(key,el){const k=key.split(":")[0];ui.pendingArm=key;ui.confirmEl=el;ui.confirmMsg=CONFIRM[k]||["Are you sure?","Yes"];ui.sheet="confirm";renderSheet();}
/* ---------- sheets (review, import, copy) ---------- */
const overlay=document.getElementById("overlay");
function renderSheet(){
  if(!ui.sheet){overlay.innerHTML="";return;}
  let title="",body="";
  if(ui.sheet==="review"){title="Estimate";body=reviewBody();}
  else if(ui.sheet==="doc"){title="Estimate preview";body=`${docPreviewHTML(docData(S.draft))}<button class="btn pri wide" data-act="senddoc">Send estimate to customer (PDF)</button><p class="hint">You can hand your phone to the customer to look at this.</p>`;}
  else if(ui.sheet==="reqdetail"){const r=getReq(ui.reqId);title="Customer's form";body=`<div style="white-space:pre-wrap;font-size:1.05rem;line-height:1.5">${esc(r?r.details:"")}</div>${r&&r.status==="new"?`<div class="btns"><button class="btn pri" data-act="reqjob" data-id="${r.id}">Make a job</button><button class="btn" data-act="reqest" data-id="${r.id}">Estimate</button></div>`:""}`;}
  else if(opsSheet()){[title,body]=opsSheet();}
  else if(ui.sheet==="confirm"){title="Please confirm";body=`<div class="confirm stack"><p>${esc(ui.confirmMsg[0])}</p><div class="btns"><button class="btn" data-act="close">No, go back</button><button class="btn danger fill" data-act="confirmyes">${esc(ui.confirmMsg[1])}</button></div></div>`;}
  else if(ui.sheet==="copy"){title="Copy estimate";body=`<p class="muted" style="margin:0">Your phone blocked automatic copy. Press and hold the text, Select All, then Copy.</p><textarea class="copy" id="copytext" readonly>${esc(ui.copyText||estimateText())}</textarea>`;}
  else if(ui.sheet==="pin"){title="Show my costs";body=`<div class="pinpad stack"><label class="f">Enter your PIN<input type="password" inputmode="numeric" id="pin-in" autocomplete="off" maxlength="8"></label><button class="btn pri wide" data-act="pincheck">Show costs</button></div>`;}
  else if(ui.sheet==="pmimport"){title="Import machines";body=importPMBody();}
  else if(ui.sheet==="import"){title="Import from Excel";body=importBody();}
  else if(ui.sheet==="backupcopy"){title="Your backup";body=`<p class="muted" style="margin:0">Press and hold the text, Select All, then Copy. Paste it into a note or an email to yourself.</p><textarea class="copy" id="copytext" readonly>${esc(backupText())}</textarea>`;}
  else if(ui.sheet==="paste"){title="Paste a backup";body=`<p class="muted" style="margin:0">Paste the backup text. Your price list is replaced with the one in the backup, and its saved estimates are added to yours.</p><textarea class="copy" id="pastetext" placeholder="Paste here"></textarea><button class="btn pri wide" data-act="restoretext">Restore</button>`;}
  overlay.innerHTML=`<div class="sheet" data-act="closebg"><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="phead"><h3>${esc(title)}</h3><button class="x" data-act="close" aria-label="Close">×</button></div><div class="pbody">${body}</div></div></div>`;
}
function jobSum(d,c){c=c||calc(d);const parts=d.custom.reduce((a,ci)=>a+(+ci.cost||0)*(+ci.qty||0),0);const other=+d.otherCost||0;const cost=parts+other;const net=c.total-c.tax;const keep=net-cost;return{pays:c.total,tax:c.tax,parts,other,cost,keep,pct:net>0?Math.round(keep/net*100):0};}
function jobSumCard(d,c){const j=jobSum(d,c);
  return`<div class="jobsum" aria-label="Job total, only you can see this"><div class="jh"><span>Job total</span><span class="pill ok">Only you see this</span></div>
  <div class="row"><span>Customer pays</span><b>${money(j.pays)}</b></div>
  ${j.tax?`<div class="row"><span class="muted">Sales tax (not yours)</span><span>−${money(j.tax)}</span></div>`:""}
  ${j.parts?`<div class="row"><span class="muted">Your parts cost</span><span>−${money(j.parts)}</span></div>`:""}
  <label class="f" style="font-weight:400">Your other costs for this job <span class="hint">Labor, helpers, fuel, dump fees</span><div class="money"><input type="text" inputmode="decimal" id="f-othercost" data-field="otherCost" value="${+d.otherCost||""}" placeholder="0"></div></label>
  <div class="row keep"><span><b style="font-size:1.15rem;color:var(--ink)">You keep</b>${j.pays?`<br><span class="muted" style="font-size:.95rem">${j.pct}% of the job</span>`:""}</span><b class="${j.keep<0?"neg":""}" id="keepamt">${money(j.keep)}</b></div></div>`;}
function reviewBody(){
  const d=S.draft,st=S.settings,c=calc(d);
  if(!c.pieces&&!c.ex.length)return`<div class="empty">Nothing added yet. Tap + on the equipment you see.</div>`;

/* ---------- Excel import ---------- */
const RX={
  qty:/^(qty|qnty|quantity|count|#|no\.?|units|how many|amount)$|qty|quantity|count/i,
  cat:/categ|type|group|section|class|area|dept|department|kind/i,
  move:/move|moving|reloc/i, remove:/haul|remov|dispos|pick ?up|junk|take ?away/i,
  install:/install|assembl|set ?up/i, service:/maint|service|\bpm\b|prevent|tune/i, repair:/repair|fix/i,
  gen:/price|cost|rate|charge|fee|\$|each|per unit|unit price|amount/i,
  name:/item|equip|machine|name|descr|product|model|piece|asset/i
};
function detect(rows){
  let best=-1,bestScore=0;
  for(let r=0;r<Math.min(rows.length,15);r++){let sc=0;if((rows[r]||[]).some(c=>typeof c==="number"||numOf(c)!==null))continue;(rows[r]||[]).forEach(c=>{const s=String(c).trim();if(!s||numOf(s)!==null)return;for(const k in RX)if(RX[k].test(s)){sc++;break;}});if(sc>bestScore){bestScore=sc;best=r;}}
  const m={h:best,name:-1,cat:-1,qty:-1,gen:-1,p:{move:-1,remove:-1,install:-1,service:-1,repair:-1}};
  const width=Math.max(0,...rows.slice(0,50).map(r=>r.length));
  if(best>=0){(rows[best]||[]).forEach((c,i)=>{const s=String(c).trim();if(!s)return;
    if(m.qty<0&&RX.qty.test(s)&&!RX.gen.test(s.replace(/amount/i,""))){m.qty=i;return;}
    if(m.cat<0&&RX.cat.test(s)&&!RX.gen.test(s)){m.cat=i;return;}
    for(const k of ["move","remove","install","service","repair"]){if(m.p[k]<0&&RX[k].test(s)&&(RX.gen.test(s)||!RX.name.test(s))){m.p[k]=i;return;}}
    if(m.gen<0&&RX.gen.test(s)&&!/total/i.test(s)){m.gen=i;return;}
    if(m.name<0&&RX.name.test(s)){m.name=i;return;}});}
  const body=rows.slice(best+1,best+60);
  const used=()=>new Set([m.cat,m.qty,m.gen,...Object.values(m.p)]);
  if(m.name<0){for(let i=0;i<width;i++){if(used().has(i))continue;const txt=body.filter(r=>{const v=String(r[i]??"").trim();return v&&numOf(v)===null;}).length;if(txt>=Math.max(1,body.length*0.4)){m.name=i;break;}}}
  const anyPrice=m.gen>=0||Object.values(m.p).some(v=>v>=0);
  if(!anyPrice||m.qty<0){const numCols=[];for(let i=0;i<width;i++){if(used().has(i)||i===m.name)continue;const n=body.filter(r=>numOf(r[i])!==null).length;if(n>=Math.max(1,body.length*0.4))numCols.push(i);}
    if(best<0||!anyPrice&&m.qty<0){ // headerless sheet: guess small whole numbers are quantities, others prices
      numCols.forEach(i=>{const vals=body.map(r=>numOf(r[i])).filter(v=>v!==null);const smallInts=vals.every(v=>Number.isInteger(v)&&v<=60);
        if(smallInts&&m.qty<0)m.qty=i;else if(m.gen<0)m.gen=i;});
    }else if(!anyPrice&&numCols.length){m.gen=numCols[0];}}
  return m;
}
function parseSheet(rows,m,sheetName,allMode){
  const out=[];let sec="";
  for(let r=m.h+1;r<rows.length;r++){const row=rows[r]||[];if(m.name<0)break;
    const name=String(row[m.name]??"").trim();if(!name||numOf(name)!==null)continue;
    const p={};let hasNum=false;
    for(const k in m.p){if(m.p[k]>=0){const v=numOf(row[m.p[k]]);if(v!==null){p[k]=v;hasNum=true;}}}
    const gen=m.gen>=0?numOf(row[m.gen]):null;const qty=m.qty>=0?numOf(row[m.qty]):null;
    if(gen!==null||qty!==null)hasNum=true;
    const filled=row.filter(c=>String(c??"").trim()!=="").length;
    const numericSheet=m.qty>=0||m.gen>=0||Object.values(m.p).some(v=>v>=0);
    if(numericSheet&&!hasNum&&filled===1){sec=name.replace(/:$/,"");continue;}
    if(/^(sub ?total|grand total|total|tax|discount)\b/i.test(name))continue;
    const catCell=m.cat>=0?String(row[m.cat]??"").trim():"";
    const sheetCat=allMode&&!/^sheet\s*\d*$/i.test(sheetName)?sheetName.trim():"";
    const cat=catCell||sec||sheetCat||guessCat(name);
    out.push({name,cat,p,gen,qty:qty&&qty>0?Math.round(qty):0});
  }
  return out;
}
function colLetter(i){let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function colLabel(i,rows,h){const L=colLetter(i);const head=h>=0?String((rows[h]||[])[i]??"").trim():"";return head?`${L}: ${head}`:`Column ${L}`;}
function reparse(){
  const im=ui.imp;let parsed=[];
  if(im.sel==="__all"){im.sheets.forEach(s=>{parsed=parsed.concat(parseSheet(s.rows,detect(s.rows),s.name,true));});}
  else{const s=im.sheets[im.sel];parsed=parseSheet(s.rows,im.map,s.name,false);}
  im.parsed=parsed;
}
async function handleFile(input){
  const file=input.files&&input.files[0];input.value="";if(!file)return;

  try{
    const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:"array"});
    const sheets=wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:true,blankrows:false})})).filter(s=>s.rows.some(r=>r.some(c=>String(c).trim()!=="")));
    if(!sheets.length){toast("That file looks empty.");return;}
    const im={file:file.name,sheets,sel:0,map:detect(sheets[0].rows)};
    im.genSvc=ui.view==="prices"?ui.psvc:ui.svc;im.cntSvc=ui.svc;
    ui.imp=im;reparse();

}

      y+=h;line(M+4,y,W-M-4,y,LINE,0.5);y+=1;});

  if(hasLogo){const bin=atob(D.logo.split(",")[1]||"");img=add({stream:bin,dict:`/Type /XObject /Subtype /Image /Width ${D.logoW} /Height ${D.logoH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`});}
  const pagesId=objs.length+pages.length*2+1;

  pages.forEach(pg=>{const content=pg.join("\n");const cid=add({stream:content,dict:""});const pid=add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${fontR} 0 R /F2 ${fontB} 0 R >>${img?` /XObject << /Im1 ${img} 0 R >>`:""} >> /Contents ${cid} 0 R >>`);kids.push(pid);});

  let out="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";const offs=[];

  return bytes;
}
function ensureEstimateNo(d){if(!d.no){const st=S.settings;d.no=+st.nextNo||1001;st.nextNo=d.no+1;touchSettings();}if(!d.docDate)d.docDate=today();touchDraft();}
function docFileName(d){return`Estimate-${d.no||""}${d.customer?"-"+d.customer.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").slice(0,30):""}.pdf`;}
function saveDraftAsEstimate(){const d=S.draft;const snap=calc(d);const rec=clone(d);rec.snap={total:snap.total,pieces:snap.pieces};rec.saved=Date.now();rec.u=Date.now();const i=S.estimates.findIndex(x=>x.id===d.id);if(i>=0)S.estimates[i]=rec;else S.estimates.unshift(rec);dirty.est.add(d.id);persist();}
async function shareFile(bytes,name,mime,shareText,okMsg){
  try{const f=new File([bytes],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name,text:shareText||""});if(okMsg)toast(okMsg);return true;}}
  catch(e){if(e&&e.name==="AbortError")return false;}
  try{if(window.claude&&claude.use){const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data:new Blob([bytes],{type:mime})});toast("Saved. Attach it to a text or email.");return true;}}}
  catch(e){if(e&&e.code==="declined")return false;}
  try{const url=URL.createObjectURL(new Blob([bytes],{type:mime}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast("Downloaded. Attach it to a text or email.");return true;}catch(e){}
  toast("This phone couldn't save the file here.");return false;
}

  catch(e){if(e&&e.code==="declined")return;}
  try{const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast("Estimate PDF downloaded. Attach it to a text or email.");render();return;}catch(e){}

function touchOp(kind,o){o.u=Date.now();dOps[kind].add(o.id);persist();}
function delOp(kind,id){S[kind]=S[kind].filter(x=>x.id!==id);dOps[kind].delete(id);xOps[kind].add(id);S.opsDel[kind]=[...xOps[kind]];persist();}
function opCol(k){return DB.doc(BASE+"/profile").collection(k);}
async function pullOps(){
  for(const k of OPK){const q=await opCol(k).get();const by=new Map(S[k].map(x=>[x.id,x]));
    q.docs.forEach(doc=>{const r=doc.data();if(!r||!r.item||xOps[k].has(doc.id))return;const loc=by.get(doc.id);if(!loc||(r.u||0)>(loc.u||0))by.set(doc.id,clone(r.item));});
    const ids=new Set(q.docs.map(x=>x.id));S[k].forEach(x=>{if(!ids.has(x.id)||by.get(x.id)===x)dOps[k].add(x.id);});S[k]=[...by.values()];}
}
async function flushOps(){
  for(const k of OPK){for(const id of [...dOps[k]]){dOps[k].delete(id);const o=S[k].find(x=>x.id===id);if(o)await opCol(k).doc(id).set({u:o.u||Date.now(),item:o});}
    for(const id of [...xOps[k]]){await opCol(k).doc(id).delete();xOps[k].delete(id);}S.opsDel[k]=[...xOps[k]];}
}
const getJob=id=>S.jobs.find(x=>x.id===id),getInv=id=>S.invoices.find(x=>x.id===id),getReq=id=>S.requests.find(x=>x.id===id),getDoc=id=>S.docs.find(x=>x.id===id);
function nextNo(key,start){const st=S.settings;const n=+st[key]||start;st[key]=n+1;touchSettings();return n;}

function weekday(x){const [y,m,d]=x.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});}
function dayLabel(x){const t=today();if(x===t)return"Today";if(x===addDays(t,1))return"Tomorrow";if(x===addDays(t,-1))return"Yesterday";return weekday(x);}

/* photos: kept in IndexedDB so they don't fill up normal storage */
const memPhotos=new Map();let pdbP=null;
function pdb(){if(!pdbP)pdbP=new Promise((res,rej)=>{try{const r=indexedDB.open("rr-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return pdbP;}
async function photoPut(id,data){memPhotos.set(id,data);try{const db=await pdb();await new Promise((res,rej)=>{const t=db.transaction("p","readwrite");t.objectStore("p").put(data,id);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){toast("Photo kept for now, but this phone may not save it after closing.");}}
async function photoGet(id){if(memPhotos.has(id))return memPhotos.get(id);try{const db=await pdb();const v=await new Promise((res,rej)=>{const r=db.transaction("p").objectStore("p").get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});if(v)memPhotos.set(id,v);return v;}catch(e){return null;}}
async function photoDel(id){memPhotos.delete(id);try{const db=await pdb();db.transaction("p","readwrite").objectStore("p").delete(id);}catch(e){}}
async function allPhotoIds(){const ids=[];S.jobs.forEach(j=>(j.photos||[]).forEach(p=>ids.push(p)));S.docs.forEach(d=>(d.photos||[]).forEach(p=>ids.push(p)));return ids;}
function hydratePhotos(){document.querySelectorAll("img[data-photo]:not([src])").forEach(async img=>{const d=await photoGet(img.dataset.photo);if(d)img.src=d;else img.alt="Photo not on this phone";});}
function resizeImage(file,max,q){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(img.width*sc));cv.height=Math.max(1,Math.round(img.height*sc));const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);res({data:cv.toDataURL("image/jpeg",q),w:cv.width,h:cv.height});};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"));};img.src=url;});}
function photoGrid(ids,act){return ids.length?`<div class="pgrid">${ids.map(id=>`<button class="pthumb" data-act="${act}" data-id="${id}" aria-label="Open photo"><img data-photo="${id}" alt="Photo"></button>`).join("")}</div>`:"";}

/* agreements create requests by themselves */
function siteNextDue(x){return x.lastPM?addMonths(x.lastPM,+x.every||3):(x.ag&&x.ag.start)||today();}
function genAgreementRequests(){let n=0;S.pm.sites.forEach(x=>{if(!x.ag||!x.ag.on)return;const due=siteNextDue(x);if(daysBetween(today(),due)>14||x.agReqFor===due)return;
  const open=S.jobs.some(j=>j.custId===x.id&&j.kind==="Maintenance visit"&&j.status!=="done")||S.requests.some(r=>r.custId===x.id&&r.kind==="pma"&&r.status==="new");
  x.agReqFor=due;touchSite(x);if(open)return;
  const r={id:uid(),created:Date.now(),kind:"pma",custId:x.id,custName:x.name,phone:x.phone||"",note:`Maintenance visit due ${fmtDate(due)} under the agreement${x.ag.price?` (${money(x.ag.price)} per visit)`:""}.`,want:due,status:"new",auto:true};S.requests.unshift(r);touchOp("requests",r);n++;});
  return n;}

function jobLines(j){const L=[];const x=j.custId&&getSite(j.custId);
  if(j.kind==="Maintenance visit"&&x&&x.ag&&x.ag.on&&+x.ag.price)L.push({desc:"Maintenance visit (agreement)",qty:1,unit:+x.ag.price,cost:0});
  (j.items||[]).forEach(i=>L.push({desc:i.desc,qty:+i.qty||1,unit:+i.unit||0,cost:+i.cost||0}));
  if(+j.hours>0)L.push({desc:`Labor (${+j.hours} hr)`,qty:+j.hours,unit:+j.rate||0,cost:0});

function invTotals(v){const sub=(v.lines||[]).reduce((a,l)=>a+(+l.qty||0)*(+l.unit||0),0);const disc=Math.round(sub*(+v.discount||0))/100;const after=sub-disc;const tax=v.applyTax&&+v.taxPct?Math.round(after*(+v.taxPct))/100:0;const total=after+tax;const paid=(v.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);const cost=(v.lines||[]).reduce((a,l)=>a+(+l.qty||0)*(+l.cost||0),0)+(+v.otherCost||0);return{sub,disc,tax,total,paid,balance:Math.round((total-paid)*100)/100,cost,keep:after-cost};}

function csvCell(v){v=String(v??"");return/[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}
function csv(rows){return rows.map(r=>r.map(csvCell).join(",")).join("\r\n");}
function usDate(x){if(!x)return"";const [y,m,d]=x.split("-");return`${m}/${d}/${y}`;}
async function exportCSV(kind){let rows,name;
  if(kind==="cust"){rows=[["Name","Company","Email","Phone","Billing Address","Notes"]];S.pm.sites.forEach(x=>rows.push([x.name,x.name,x.email||"",x.phone||"",x.address||"",x.contact?`Contact: ${x.contact}`:""]));name="customers-for-quickbooks.csv";}
  else if(kind==="inv"){rows=[["InvoiceNo","Customer","InvoiceDate","DueDate","Item(Product/Service)","ItemDescription","ItemQuantity","ItemRate","ItemAmount","Taxable","TaxRate","Memo"]];
    S.invoices.forEach(v=>{(v.lines||[]).forEach(l=>rows.push([v.no,v.custName,usDate(v.date),usDate(v.due),"Services",l.desc,+l.qty||0,(+l.unit||0).toFixed(2),((+l.qty||0)*(+l.unit||0)).toFixed(2),v.applyTax&&+v.taxPct?"Y":"N",v.applyTax&&+v.taxPct?v.taxPct+"%":"",v.notes||""]));});name="invoices-for-quickbooks.csv";}
  else{rows=[["Date","Customer","InvoiceNo","Amount","Method","Note"]];S.invoices.forEach(v=>(v.payments||[]).forEach(p=>rows.push([usDate(p.date),v.custName,v.no,(+p.amount||0).toFixed(2),p.method,p.note||""])));name="payments.csv";}
  if(rows.length<2){toast("Nothing to export yet.");return;}
  await shareFile(new TextEncoder().encode(csv(rows)),name,"text/csv","",`${name} ready`);}

/* ---------- Settings: import prices from any Excel layout ---------- */
const PSVC=[["move",/\bmov(e|es|ing)\b|reloc/i],["remove",/haul|remov|dispos(e|al)(?! fee)|pick ?up|junk|take ?away|take ?out/i],["install",/install|assembl|set ?up|build/i],["service",/maint|\bpm\b|prevent|tune|inspect|clean|service(?! ?type)/i],["repair",/repair|fix|diagnos/i]];

const PH={name:/item|equip|machine|name|descr|product|piece|asset|unit type|equipment type/i,brand:/brand|make\b|manufact|mfr|mfg|vendor/i,model:/model|mdl/i,cat:/categ|group|section|class|dept|department|kind/i,svc:/^(service|work|job|task|labor|labour)s?( ?type)?$|service ?type|work ?type|job ?type|type of (work|service)/i,price:/price|cost|rate|charge|fee|amount|\$|each|per unit/i,skip:/total|qty|quantity|count|serial|notes?|comment|date|phone|address|email|customer|location/i};
function pDetect(rows,sheetName){
  let best=-1,top=0;
  for(let r=0;r<Math.min(rows.length,15);r++){const row=rows[r]||[];if(row.some(c=>typeof c==="number"))continue;let sc=0;row.forEach(c=>{const v=String(c).trim();if(!v||v.length>40)return;if(PH.name.test(v)||PH.brand.test(v)||PH.model.test(v)||PH.cat.test(v)||PH.price.test(v)||svcOf(v)||PH.svc.test(v))sc++;});if(sc>top){top=sc;best=r;}}
  const m={h:top>=1?best:-1,name:-1,brand:-1,model:-1,cat:-1,svc:-1,gen:-1,p:{move:-1,remove:-1,install:-1,service:-1,repair:-1}};
  const width=Math.max(0,...rows.slice(0,60).map(r=>r.length));const body=rows.slice(m.h+1,m.h+80);
  const numericCol=i=>{const vals=body.map(r=>r[i]).filter(v=>String(v??"").trim()!=="");return vals.length&&vals.filter(v=>numOf(v)!==null).length>=vals.length*0.6;};
  if(m.h>=0)(rows[m.h]||[]).forEach((c,i)=>{const v=String(c).trim();if(!v)return;
    if(m.svc<0&&PH.svc.test(v)&&!PH.price.test(v)){m.svc=i;return;}
    if(m.brand<0&&PH.brand.test(v)){m.brand=i;return;}
    if(m.model<0&&PH.model.test(v)&&!PH.price.test(v)){m.model=i;return;}
    if(m.cat<0&&PH.cat.test(v)&&!PH.price.test(v)){m.cat=i;return;}
    const sv=svcOf(v);if(sv&&m.p[sv]<0&&(PH.price.test(v)||numericCol(i))){m.p[sv]=i;return;}
    if(PH.skip.test(v)&&!PH.price.test(v))return;
    if(m.gen<0&&PH.price.test(v)&&!/total/i.test(v)){m.gen=i;return;}
    if(m.name<0&&PH.name.test(v)&&!numericCol(i)){m.name=i;return;}});
  const used=()=>new Set([m.name,m.brand,m.model,m.cat,m.svc,m.gen,...Object.values(m.p)]);
  if(m.name<0&&m.brand<0&&m.model<0){for(let i=0;i<width;i++){if(used().has(i))continue;const t=body.filter(r=>{const v=String(r[i]??"").trim();return v&&numOf(v)===null;}).length;if(t>=Math.max(1,body.length*0.4)){m.name=i;break;}}}
  if(m.gen<0&&!Object.values(m.p).some(v=>v>=0)){for(let i=0;i<width;i++){if(used().has(i))continue;if(numericCol(i)){const hv=m.h>=0?String((rows[m.h]||[])[i]??""):"";if(PH.skip.test(hv))continue;m.gen=i;break;}}}

const EXTRA_RX=[["trip",/trip|travel|mileage|fuel|service call fee|call ?out/i],["stairs",/^stairs?\b(?!\s*(climber|master|mill|stepper))|per flight|flights? of stairs/i],["dump",/dump|landfill|disposal fee|recycl/i],["labor",/^(extra )?labou?r|hourly|per hour|man ?hours?|tech(nician)? (rate|time)/i]];
function pParse(sheet,m,genSvc,useSheetName){
  const rows=sheet.rows,out=new Map();let sec="";
  const cell=(row,i)=>i>=0?String(row[i]??"").trim():"";
  for(let r=m.h+1;r<rows.length;r++){const row=rows[r]||[];
    let name=cell(row,m.name),brand=cell(row,m.brand),model=cell(row,m.model);
    if(numOf(name)!==null)name="";
    const p={};let has=false;
    for(const k in m.p){if(m.p[k]>=0){const v=numOf(row[m.p[k]]);if(v!==null&&v>=0){p[k]=v;has=true;}}}
    const g=m.gen>=0?numOf(row[m.gen]):null;
    if(g!==null&&g>=0){let sv=null;if(m.svc>=0)sv=svcOf(cell(row,m.svc));if(!sv)sv=(useSheetName&&m.sheetSvc)||genSvc;p[sv]=g;has=true;}
    const filled=row.filter(c=>String(c??"").trim()!=="").length;
    if(!name&&!brand&&!model)continue;
    if(!has&&filled===1&&(name||brand)&&m.cat<0){sec=(name||brand).replace(/:$/,"");continue;}
    if(/^(sub ?total|grand total|total|tax|discount)\b/i.test(name))continue;
    if(!name)name=[brand,model].filter(Boolean).join(" ");
    let cat=cell(row,m.cat)||sec||(useSheetName&&!/^sheet\s*\d*$/i.test(sheet.name)&&!m.sheetSvc?sheet.name.trim():"")||guessCat(`${name} ${model}`);
    if(cat&&cat===cat.toUpperCase()&&/[A-Z]/.test(cat))cat=cat.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
    const known=catsInOrder().find(c=>norm(c)===norm(cat));if(known)cat=known;
    const ex=!brand&&!model?(EXTRA_RX.find(([,rx])=>rx.test(name))||[])[0]:null;
    const key=norm(name)+"|"+norm(brand)+"|"+norm(model);
    const cur=out.get(key);
    if(cur){Object.assign(cur.p,p);}else out.set(key,{key,name,brand,model,cat,p,extra:ex||null});
  }
  return[...out.values()].filter(x=>Object.keys(x.p).length||x.brand||x.model);
}
function pMatch(x){const st=S.settings;const nb=norm(x.brand),nm=norm(x.model);
  return st.items.find(i=>nb&&nm&&norm(i.brand||"")===nb&&norm(i.model||"")===nm)||st.items.find(i=>norm(i.name)===norm(x.name)&&(!nb||!i.brand||norm(i.brand)===nb)&&(!nm||!i.model||norm(i.model)===nm));}
function pBuild(){const im=ui.pimp;let rows=[];
  const sheets=im.sel==="__all"?im.sheets.map((s,i)=>i):[im.sel];
  sheets.forEach(i=>{const s=im.sheets[i];const m=im.sel==="__all"?pDetect(s.rows,s.name):im.map;rows=rows.concat(pParse(s,m,im.genSvc,true));});
  rows.forEach(x=>{if(x.extra){x.status="extra";return;}const it=pMatch(x);x.matchId=it?it.id:null;
    if(!it)x.status="new";else{const diff=Object.entries(x.p).some(([k,v])=>+it.p[k]!==+v)||(x.brand&&!it.brand)||(x.model&&!it.model);x.status=diff?"update":"same";}});
  im.rows=rows;im.skip=im.skip||new Set();}
async function pOpenFile(input){

function pApply(){

    else{if(x.brand)it.brand=x.brand;if(x.model)it.model=x.model;changed++;}

const GATE_SALT="rr-assembly-gate-v1",GATE_ITER=150000,GATE_DEFAULT={h:"362a1409d9a2f2004073e25e7346c0c545702e39df718e84245f00f9bb1502fb",n:7};
const GATE_KEY=KEY+".gate",GATE_SES=KEY+".unlocked";
function gateRec(){try{const r=JSON.parse(localStorage.getItem(GATE_KEY)||"null");if(r&&r.h)return r;}catch(e){}return GATE_DEFAULT;}
async function pinHash(pin){const enc=new TextEncoder();const km=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(GATE_SALT),iterations:GATE_ITER,hash:"SHA-256"},km,256);return[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");}
const gate={locked:false,entry:"",fails:0,until:0,hiddenAt:0,after:[]};
function gateCan(){return!!(window.crypto&&crypto.subtle);}
function gateIsUnlocked(){try{return sessionStorage.getItem(GATE_SES)==="1";}catch(e){return false;}}
function gateShow(){gate.locked=true;gate.entry="";document.body.classList.add("locked");let g=document.getElementById("gate");if(!g){g=document.createElement("div");g.id="gate";g.setAttribute("role","dialog");g.setAttribute("aria-modal","true");g.setAttribute("aria-label","Enter PIN");document.body.appendChild(g);}gateDraw();}
function gateDraw(msg){const g=document.getElementById("gate");if(!g)return;const n=Math.max(gateRec().n||4,gate.entry.length);const wait=Math.max(0,Math.ceil((gate.until-Date.now())/1000));
  g.innerHTML=`<div class="gbox"><div class="glogo" aria-hidden="true">R&amp;R</div><h1>${esc(S.settings.company||"R&R Assembly Services")}</h1><p class="gsub">${wait?`Too many tries. Wait ${wait} seconds.`:esc(msg||"Enter your PIN to open the app")}</p>
  <div class="gdots${msg&&!wait?" shake":""}" aria-live="polite" aria-label="${gate.entry.length} digits entered">${Array.from({length:n},(_,i)=>`<span class="${i<gate.entry.length?"on":""}"></span>`).join("")}</div>
  <input id="gate-in" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" value="" class="ghid">
  <div class="gpad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-gk="${d}" aria-label="${d}">${d}</button>`).join("")}<button data-gk="clr" aria-label="Clear" class="gsm">Clear</button><button data-gk="0" aria-label="0">0</button><button data-gk="del" aria-label="Delete last digit" class="gsm">⌫</button></div>
  <button class="btn pri wide" data-gk="ok" style="min-height:3.5rem;font-size:1.15rem">Unlock</button></div>`;
  if(wait)setTimeout(()=>gate.locked&&gateDraw(),1000);}
async function gateTry(){if(Date.now()<gate.until){gateDraw();return;}const pin=gate.entry;if(!pin)return;
  const h=await pinHash(pin);if(h===gateRec().h){gate.locked=false;gate.fails=0;try{sessionStorage.setItem(GATE_SES,"1");}catch(e){}document.body.classList.remove("locked");const g=document.getElementById("gate");if(g)g.remove();const run=gate.after.splice(0);run.forEach(f=>f());render();return;}
  gate.fails++;gate.entry="";if(gate.fails>=5)gate.until=Date.now()+Math.min(300,30*Math.pow(2,gate.fails-5))*1000;gateDraw("That PIN isn't right. Try again.");}
function gateKey(k){if(!gate.locked)return;if(Date.now()<gate.until)return;
  if(k==="ok"){gateTry();return;}if(k==="del")gate.entry=gate.entry.slice(0,-1);else if(k==="clr")gate.entry="";else if(/^\d$/.test(k)&&gate.entry.length<10)gate.entry+=k;
  gateDraw();if(gate.entry.length>=(gateRec().n||99))gateTry();}
document.addEventListener("click",e=>{const b=e.target.closest("[data-gk]");if(b){e.stopPropagation();gateKey(b.dataset.gk);}},true);
document.addEventListener("keydown",e=>{if(!gate.locked)return;if(/^\d$/.test(e.key))gateKey(e.key);else if(e.key==="Backspace")gateKey("del");else if(e.key==="Enter")gateKey("ok");else return;e.preventDefault();e.stopPropagation();},true);
document.addEventListener("visibilitychange",()=>{if(ui.mode==="public")return;if(document.hidden){gate.hiddenAt=Date.now();}else if(gate.hiddenAt&&Date.now()-gate.hiddenAt>5*60*1000&&!gate.locked&&gateCan()){try{sessionStorage.removeItem(GATE_SES);}catch(e){}gateShow();}});
async function gateChange(cur,next,again){if(!/^\d{4,10}$/.test(next)){toast("The new PIN must be 4 to 10 numbers.");return false;}if(next!==again){toast("The new PINs don't match.");return false;}
  if(await pinHash(cur)!==gateRec().h){toast("Your current PIN isn't right.");return false;}
  try{localStorage.setItem(GATE_KEY,JSON.stringify({h:await pinHash(next),n:next.length}));}catch(e){toast("Couldn't save the new PIN on this phone.");return false;}
  toast("App PIN changed on this phone");return true;}

  if(t.dataset.cfok&&ui.cf){ui.cf.ok=t.checked;return;}
  if(t.dataset.jf){const j=getJob(ui.jobId);if(!j)return;const f=t.dataset.jf;j[f]=(f==="hours"||f==="rate")?Math.max(0,numOf(t.value)||0):t.value;touchOp("jobs",j);if(f==="hours"||f==="rate"){const tt=document.getElementById("jobtotal");if(tt)tt.textContent=money(jobLines(j).reduce((a,l)=>a+l.qty*l.unit,0));}return;}
  if(t.dataset.if){const v=getInv(ui.invId);if(!v)return;const f=t.dataset.if;v[f]=f==="applyTax"?t.value==="1":(f==="discount"||f==="otherCost")?Math.max(0,numOf(t.value)||0):t.value;touchOp("invoices",v);return;}
  if(t.dataset.ag){const x=getSite(ui.pmSite);if(!x)return;x.ag=x.ag||{on:false};x.ag[t.dataset.ag]=t.dataset.ag==="price"?Math.max(0,numOf(t.value)||0):t.value;touchSite(x);return;}
  if(t.id==="tip-search"){ui.tipq=t.value;const pos=t.selectionStart;render();const s3=document.getElementById("tip-search");s3.focus();try{s3.setSelectionRange(pos,pos);}catch(_){}return;}
  if(t.dataset.pcost||t.dataset.pprice){const x=getSite(ui.pmSite);const m=x&&x.machines.find(y=>y.id===ui.pmMachine);const id=t.dataset.pcost||t.dataset.pprice;const p=m&&partsOf(m).find(q=>q.id===id);if(!p)return;
    if(t.dataset.pcost)p.cost=Math.max(0,numOf(t.value)||0);else p.price=Math.max(0,numOf(t.value)||0);touchSite(x);return;}
  if(t.dataset.ps){const x=getSite(ui.pmSite);if(!x)return;x[t.dataset.ps]=t.dataset.ps==="every"?+t.value:t.value;touchSite(x);return;}
  if(t.dataset.pm){const x=getSite(ui.pmSite);const m=x&&x.machines.find(y=>y.id===ui.pmMachine);if(!m)return;m[t.dataset.pm]=t.value;touchSite(x);return;}
  if(t.id==="f-search"){ui.q=t.value;const pos=t.selectionStart;render();const s=document.getElementById("f-search");s.focus();try{s.setSelectionRange(pos,pos);}catch(_){}return;}
  if(t.dataset.qty){setQty(t.dataset.qty,numOf(t.value)||0);const row=t.closest(".item");if(row)row.classList.toggle("on",(numOf(t.value)||0)>0);renderBar();return;}
  if(t.dataset.xqty){const v=Math.max(0,numOf(t.value)||0);if(v)S.draft.extras[t.dataset.xqty]=v;else delete S.draft.extras[t.dataset.xqty];touchDraft();renderBar();return;}
  if(t.dataset.field&&t.dataset.field!=="tax"){const f=t.dataset.field;S.draft[f]=f==="discount"?Math.max(0,Math.min(100,numOf(t.value)||0)):f==="otherCost"?Math.max(0,numOf(t.value)||0):t.value;touchDraft();if(f==="discount"||f==="otherCost")renderBar();if(f==="otherCost"){const j=jobSum(S.draft);const k=document.getElementById("keepamt");if(k){k.textContent=money(j.keep);k.className=j.keep<0?"neg":"";}}return;}
  if(t.dataset.sfield){const f=t.dataset.sfield;S.settings[f]=(f==="taxRate"||f==="markup"||f==="validDays"||f==="nextNo"||f==="laborRate"||f==="payDays"||f==="nextInv"||f==="nextJob")?Math.max(0,Math.round((numOf(t.value)||0)*100)/100):t.value;touchSettings();if(f==="company")document.getElementById("title").textContent=S.settings.company||"Estimates";return;}
  if(t.dataset.iname){const it=S.settings.items.find(x=>x.id===t.dataset.iname);if(it){it.name=t.value;touchSettings();}return;}
  if(t.dataset.ibrand||t.dataset.imodel){const it=S.settings.items.find(x=>x.id===(t.dataset.ibrand||t.dataset.imodel));if(it){if(t.dataset.ibrand)it.brand=t.value;else it.model=t.value;touchSettings();}return;}
  if(t.dataset.iprice){const it=S.settings.items.find(x=>x.id===t.dataset.iprice);if(it){it.p[ui.psvc]=Math.max(0,numOf(t.value)||0);S.settings.sample=false;touchSettings();}return;}
  if(t.dataset.ename||t.dataset.eprice||t.dataset.eunit){const id=t.dataset.ename||t.dataset.eprice||t.dataset.eunit;const ex=S.settings.extras.find(x=>x.id===id);if(!ex)return;
    if(t.dataset.ename)ex.name=t.value;else if(t.dataset.eprice)ex.price=Math.max(0,numOf(t.value)||0);else ex.unit=t.value;touchSettings();return;}
});
document.addEventListener("focusin",e=>{if(e.target.dataset&&e.target.dataset.qty)setTimeout(()=>{try{e.target.select();}catch(_){}},0);});
document.addEventListener("toggle",e=>{if(e.target&&e.target.id==="more")ui.moreOpen=e.target.open;},true);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&ui.owner){ui.owner=false;render();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&ui.sheet==="pin"){e.preventDefault();document.querySelector('[data-act=pincheck]').click();return;}if(e.key==="Escape"&&ui.sheet){ui.sheet=null;ui.imp=null;ui.pmimp=null;ui.copyText=null;renderSheet();}});

const HOSTED=/^https?:$/.test(location.protocol)&&!/claude|anthropic/i.test(location.hostname);
if(HOSTED&&!S.settings.appUrl){S.settings.appUrl=location.origin+location.pathname.replace(/index\.html$/,"");try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
if(HOSTED&&"serviceWorker" in navigator){const regSW=()=>navigator.serviceWorker.register("sw.js").catch(()=>{});if(document.readyState==="complete")regSW();else window.addEventListener("load",regSW);setTimeout(regSW,4000);}
let PUBLIC=false;
try{const hsh=location.hash||"";
  if(hsh.startsWith("#form=")){ui.pubCfg=b64d(hsh.slice(6));ui.mode="public";ui.cf=newCF();PUBLIC=true;}
  else if(hsh.startsWith("#add=")){try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}const doAdd=()=>{const r=importRequestCode(hsh);if(r){ui.view="home";render();setTimeout(()=>toast(`Request from ${r.custName} added`),300);}};if(gateCan()&&!gateIsUnlocked())gate.after.push(doAdd);else doAdd();}
}catch(e){}
if(!PUBLIC&&gateCan()&&!gateIsUnlocked())gateShow();
render();
if(!PUBLIC){(async()=>{
  try{const kept=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false;ui.storeStat=kept?"✓ This phone has agreed to keep the app's data.":"Tip: install the app on your home screen so the phone keeps its data safe.";}catch(e){}
  if(!LS_HAD){const raw=await mirrorLoad();if(raw){try{const o=JSON.parse(raw);if(o&&o.settings&&o.settings.items){S=Object.assign(S,o);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(!gate.locked)render();toast("Your saved work was brought back");}}catch(e){}}}
  else mirrorSave();
})();
setTimeout(()=>connect(0),0);}
if(!PUBLIC)setTimeout(()=>{try{const n=reminders().length;if(n&&ui.view!=="home")toast(`${n} reminder${n>1?"s":""} on the Home tab`);}catch(e){}},600);
})();
